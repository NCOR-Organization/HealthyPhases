name: Deploy

on:
  push:
    branches:
      - main

# One deploy at a time. Two merges in quick succession would otherwise race
# each other through the same git pull and container restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/HealthyPhases
            git pull --ff-only origin main
            # pyproject sources naas-abi* from .abi/libs/* as path dependencies,
            # so the submodule has to move with the pin or uv cannot resolve them.
            git submodule update --init --recursive
            cd abi-phases

            # --no-deps is load-bearing. Naming two services does NOT limit the
            # blast radius: compose still resolves depends_on, and dagster
            # depends on coding-init (service_completed_successfully), which
            # pulls in coder and forgejo. Without this flag the deploy starts
            # the whole coding stack and leaves abi in `created`, waiting behind
            # a bootstrap that takes many minutes -- an outage, not a deploy.
            #
            # --force-recreate is also required: config.local.yaml is
            # bind-mounted through .:/app, so a pull changes the file on disk
            # while the running container keeps the old config in memory. With
            # the service definition unchanged, plain `up -d` is a no-op and the
            # deploy silently does nothing.
            #
            # Dependencies are long-running services that are already up; this
            # deploy replaces application containers, it does not bootstrap the
            # stack.
            # Build changes to native runtime dependencies before replacing services.
            # BuildKit reuses cached layers when the Dockerfile is unchanged.
            docker compose up -d --build --no-deps --force-recreate abi dagster

      - name: Verify the API came back
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/HealthyPhases/abi-phases
            for i in $(seq 1 24); do
              sleep 10
              code=$(docker compose exec -T abi curl -sS -o /dev/null -w '%{http_code}' \
                       --max-time 8 http://localhost:9879/ 2>/dev/null || true)
              if [ "$code" = "200" ]; then
                echo "API healthy after ~$((i*10))s"
                exit 0
              fi
            done
            echo "API did not return 200 within 240s" >&2
            docker compose logs --tail=40 abi >&2
            exit 1
