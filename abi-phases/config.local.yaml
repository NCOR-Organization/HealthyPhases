
api:
  title: "ABI - HealthyPhases API"
  description: "API for ABI - HealthyPhases, your Artifical Business Intelligence"
  logo_path: "assets/logo.png"
  favicon_path: "assets/favicon.ico"
  cors_origins:
    - "http://{{ secret.PUBLIC_WEB_HOST }}"
    - "https://{{ secret.PUBLIC_WEB_HOST }}"
    - "http://{{ secret.PUBLIC_API_HOST }}"
    - "https://{{ secret.PUBLIC_API_HOST }}"

global_config:
  ai_mode: "cloud"

modules:
  - module: naas_abi
    enabled: true
    config:
      nexus_config:
        database_url: "postgresql+asyncpg://{{ secret.POSTGRES_USER }}:{{ secret.POSTGRES_PASSWORD }}@postgres:5432/nexus"
        app_name: "HealthyPhases Nexus"
        api_url: "http://{{ secret.PUBLIC_API_HOST }}"
        frontend_url: "http://{{ secret.PUBLIC_WEB_HOST }}"
        feature_flags:
          enabled_features:
            - chat
            - files
            - agents
            - search
            - ontology
            - graph
            - settings
          role_baseline:
            owner: [chat, files, agents, search, ontology, graph, settings]
            admin: [chat, files, agents, search, ontology, graph, settings]
            member: [chat, files]
            viewer: [chat, files]
          workspace_overrides: {}
        magic_link_allow_signup: false
        magic_link_email_app_name: "HealthyPhases Platform"
        magic_link_email_subject_template: "Your {app_name} sign-in link"
        magic_link_email_text_template: "Use this link to sign in to {app_name}:\n\n{magic_link_url}\n\nThis link expires in {expire_minutes} minutes."
        magic_link_email_html_template: "<p>Use this link to sign in to {app_name}:</p><p><a href=\"{magic_link_url}\">Sign in</a></p><p>This link expires in {expire_minutes} minutes.</p>"
        tenant:
          tab_title: "HealthyPhases | ABI Nexus"
          primary_color: "#22c55e"
          accent_color: "#16a34a"
          logo_emoji: "🏥"
          show_powered_by: true
        users:
          - email: "maxime@naas.ai"
            name: "Maxime"
            store_credentials_in_secrets: true
          - email: "jeremy@naas.ai"
            name: "Jeremy"
            store_credentials_in_secrets: true
        organizations:
          - name: "HealthyPhases"
            slug: "healthyphases"
            owner_email: "maxime@naas.ai"
            logo_emoji: "🏥"
            primary_color: "#22c55e"
            accent_color: "#16a34a"
            show_powered_by: true
            members:
              - email: "maxime@naas.ai"
                role: "owner"
              - email: "jeremy@naas.ai"
                role: "member"
            workspaces:
              - name: "Main Workspace"
                slug: "main"
                owner_email: "maxime@naas.ai"
                primary_color: "#22c55e"
                members:
                  - email: "maxime@naas.ai"
                    role: "owner"
                  - email: "jeremy@naas.ai"
                    role: "member"

  - module: naas_abi_marketplace.ai.chatgpt
    enabled: true
    config:
      openai_api_key: "{{ secret.OPENAI_API_KEY }}"

  - module: phases
    enabled: true
    config:
      google_api_key: "{{ secret.GOOGLE_API_KEY }}"

  - module: naas_abi_marketplace.applications.pubmed
    enabled: true

default_agent: 'abi_phases.phases ELOAgent'


services:
  model_registry:
    default_chat_model: "gpt-4.1-mini"
    default_embedding_model: "text-embedding-3-large"
  secret:
    secret_adapters:
      - adapter: "dotenv"
        config: {}
  object_storage:
    object_storage_adapter:
      adapter: "s3"
      config:
        bucket_name: "abi"
        base_prefix: "abi/datastore"
        access_key_id: "{{ secret.MINIO_ROOT_USER }}"
        secret_access_key: "{{ secret.MINIO_ROOT_PASSWORD }}"
        endpoint_url: "http://minio:9000"
  triple_store:
    triple_store_adapter:
      adapter: "apache_jena_tdb2"
      config:
        jena_tdb2_url: "http://admin:{{ secret.FUSEKI_ADMIN_PASSWORD }}@fuseki:3030/ds"
  vector_store:
    vector_store_adapter:
      adapter: "qdrant"
      config:
        host: "qdrant"
        port: 6333
  bus:
    bus_adapter:
      adapter: "rabbitmq"
      config:
        rabbitmq_url: "amqp://{{ secret.RABBITMQ_USER }}:{{ secret.RABBITMQ_PASSWORD }}@rabbitmq:5672"
  kv:
    kv_adapter:
      adapter: "redis"
      config:
        redis_url: "redis://redis:6379"
