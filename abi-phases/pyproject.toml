[project]
name = "phases"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai>=2.1.12",
    "naas-abi>=1.11.0",
    "naas-abi-cli>=1.23.0",
    "naas-abi-core[all]>=1.20.1",
    "naas-abi-marketplace[ai-chatgpt,applications-pubmed]>=1.8.0",
    "protobuf>=6.33.6,<7",
    "protovalidate>=2.0,<3",
    "pymupdf-layout>=1.26.6",
    "pymupdf4llm>=0.2.9",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.uv.sources]
naas-abi = { path = ".abi/libs/naas-abi",  editable = true }
naas-abi-core = { path = ".abi/libs/naas-abi-core",  editable = true }
naas-abi-marketplace = { path = ".abi/libs/naas-abi-marketplace",  editable = true }
naas-abi-cli = { path = ".abi/libs/naas-abi-cli",  editable = true }

[tool.setuptools.package-data]
"phases_v2" = ["apps/*/*.html", "apps/*/manifest.json", "prompts/templates/*.txt", "ontologies/*.ttl", "README.md"]
"phases_v2.extraction.contracts" = ["*.proto", "*.pb"]

"phases_v2.app.contracts" = ["*.proto", "*.pb"]
