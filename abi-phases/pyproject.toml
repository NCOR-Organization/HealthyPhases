[project]
name = "phases"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai>=2.1.12",
    "naas-abi>=2.93.1",
    "naas-abi-cli>=2.28.1",
    "naas-abi-core[all]>=2.44.0",
    "naas-abi-marketplace[ai-chatgpt]>=3.60.0",
    "protobuf>=6.33.6,<7",
    "protovalidate>=2.0,<3",
    "pymupdf-layout>=1.26.6",
    "pymupdf4llm>=0.2.9",
    "ratelimit>=2.2.1",
    "requests>=2.32.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.uv.sources]
naas-abi = { path = ".abi/libs/naas-abi",  editable = true }
naas-abi-core = { path = ".abi/libs/naas-abi-core",  editable = true }
naas-abi-marketplace = { path = ".abi/libs/naas-abi-marketplace",  editable = true }
naas-abi-cli = { path = ".abi/libs/naas-abi-cli",  editable = true }

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.3"]

[tool.setuptools.package-data]
"phases_v2" = ["apps/*/*.html", "apps/*/*.json", "apps/*/**/*.css", "apps/*/**/*.js", "prompts/templates/*.txt", "ontologies/*.ttl", "README.md"]
"phases_v2.extraction.contracts" = ["*.proto", "*.pb"]

"phases_v2.app.contracts" = ["*.proto", "*.pb"]

"phases_v2.projection.contracts" = ["*.proto", "*.pb"]

"pubmed" = ["LICENSE", "UPSTREAM.md", "README.md", "contracts/*.proto", "contracts/*.pb", "ontologies/*.ttl"]

"openalex" = ["README.md", "contracts/*.proto", "contracts/*.pb"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
