syntax = "proto3";
package phases_v2.app.v1;
import "buf/validate/validate.proto";

message SearchQuery {
  string mode = 1 [(buf.validate.field).string = {in: ["keyword", "semantic"]}];
  string query = 2 [(buf.validate.field).string.max_len = 10000];
  uint32 limit = 3 [(buf.validate.field).uint32 = {gte: 1, lte: 100}];
  uint64 offset = 4;
  optional double score_threshold = 5 [(buf.validate.field).double = {gte: -1, lte: 1}];
  repeated string prompts = 6 [(buf.validate.field).repeated = {max_items: 100, items: {string: {max_len: 200}}}];
  repeated string models = 7 [(buf.validate.field).repeated = {max_items: 100, items: {string: {max_len: 200}}}];
  repeated string paths = 8 [(buf.validate.field).repeated = {max_items: 100, items: {string: {max_len: 1024}}}];
  optional uint64 snapshot = 9;
}
