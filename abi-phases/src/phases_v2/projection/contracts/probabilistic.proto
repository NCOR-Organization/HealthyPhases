syntax = "proto3";
package phases_v2.projection.v1;
import "buf/validate/validate.proto";

message ProbabilisticRelation {
  string relation_id = 1 [(buf.validate.field).string.min_len = 1];
  string item_id = 2 [(buf.validate.field).string.min_len = 1];
  uint32 relation_index = 3;
  string extraction_id = 4 [(buf.validate.field).string.min_len = 1];
  string chunk_id = 5 [(buf.validate.field).string.min_len = 1];
  string paper_id = 6 [(buf.validate.field).string.min_len = 1];
  string prompt_id = 7 [(buf.validate.field).string.min_len = 1];
  string model_id = 8 [(buf.validate.field).string.min_len = 1];
  string subject_process = 9 [(buf.validate.field).string.min_len = 1];
  string subject_participant = 10 [(buf.validate.field).string.min_len = 1];
  string target_process = 11 [(buf.validate.field).string.min_len = 1];
  string direction = 12 [(buf.validate.field).string = {in: ["increases", "decreases", "no-effect"]}];
  string evidence_text = 13 [(buf.validate.field).string.min_len = 1];
}
