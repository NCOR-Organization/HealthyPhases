syntax = "proto3";
package pubmed.v1;
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

message Search {
  string query = 1 [(buf.validate.field).string = {min_len: 1, max_len: 2000, pattern: "\\S"}];
  string start_date = 2 [(buf.validate.field).string = {pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  string end_date = 3 [(buf.validate.field).string = {pattern: "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  string sort = 4 [(buf.validate.field).string = {in: ["relevance", "pub_date"]}];
  int32 max_results = 5 [(buf.validate.field).int32 = {gte: 1, lte: 1000}];
}
message Submit {
  string query_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string pmids = 2 [(buf.validate.field).repeated = {max_items: 1000, unique: true, items: {string: {pattern: "^[0-9]+$"}}}];
}
message BrowsePapers {
  string search = 1 [(buf.validate.field).string.max_len = 300];
  string query_id = 2 [(buf.validate.field).string.pattern = "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"];
  string status = 3 [(buf.validate.field).string = {in: ["published", "unpublished", "all"]}];
  string ingested_from = 4 [(buf.validate.field).string.pattern = "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  string ingested_until = 5 [(buf.validate.field).string.pattern = "^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  string sort = 6 [(buf.validate.field).string = {in: ["newest", "oldest", "title"]}];
  int32 page = 7 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 8 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
}
message LibraryPaper {
  PaperRecord paper = 1;
  repeated ArtifactRecord artifacts = 2;
  string last_ingested_at = 3;
}
message LibraryPage {
  repeated LibraryPaper papers = 1 [(buf.validate.field).repeated.max_items = 100];
  int32 total = 2 [(buf.validate.field).int32.gte = 0];
  int32 page = 3 [(buf.validate.field).int32.gte = 1];
  int32 page_size = 4 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
  int32 total_pages = 5 [(buf.validate.field).int32.gte = 0];
}
message ScheduleCreate {
  string query_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 120, pattern: "\\S"}];
  int32 interval_hours = 3 [(buf.validate.field).int32 = {in: [1, 24, 168]}];
  bool enabled = 4;
  bool ingest_new = 5;
}
message ScheduleToggle {
  optional bool enabled = 1 [(buf.validate.field).required = true];
}
message ScheduleRecord {
  string schedule_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2;
  Search search = 3;
  int32 interval_hours = 4;
  bool enabled = 5;
  bool ingest_new = 6;
  string created_at = 7;
  string next_run_at = 8;
  string last_started_at = 9;
  string last_finished_at = 10;
  string status = 11;
  string run_id = 12;
  string last_query_id = 13;
  string last_request_id = 14;
  string error = 15;
  bool last_truncated = 16;
}
message QueryRecord {
  string query_id = 1;
  string query = 2;
  string start_date = 3;
  string end_date = 4;
  string sort = 5;
  int32 max_results = 6;
  int32 total = 7;
  string created_at = 8;
  int32 contract_version = 9;
}
message PaperRecord {
  string pmid = 1;
  string pmcid = 2;
  string doi = 3;
  string title = 4;
  string journal = 5;
  string publication_date = 6;
  repeated string authors = 7;
}
message MembershipRecord {
  string query_id = 1;
  string pmid = 2;
}
message ArtifactRecord {
  string artifact_id = 1 [(buf.validate.field).string.min_len = 1];
  string pmid = 2;
  string pmcid = 3 [(buf.validate.field).string.min_len = 1];
  string version = 4 [(buf.validate.field).string.min_len = 1];
  string status = 5 [(buf.validate.field).string.const = "ready"];
  string storage_prefix = 6 [(buf.validate.field).string.min_len = 1];
  string storage_key = 7 [(buf.validate.field).string.min_len = 1];
  string content_sha256 = 8 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
  int64 size_bytes = 9 [(buf.validate.field).int64.gt = 0];
  string mime_type = 10;
  string source_url = 11 [(buf.validate.field).string.min_len = 1];
  string license = 12;
  string published_at = 13;
  int32 contract_version = 14 [(buf.validate.field).int32.const = 1];
}
message RequestRecord {
  string request_id = 1;
  string query_id = 2;
  repeated string pmids = 3;
  string status = 4;
  string requested_at = 5;
  string started_at = 6;
  string finished_at = 7;
  string run_id = 8;
  string error = 9;
  google.protobuf.Struct outcomes = 10;
}

message BackfillCreate {
  string query_id = 1 [(buf.validate.field).string.uuid = true];
}
message BackfillRange {
  int32 lower = 1 [(buf.validate.field).int32.gte = 1];
  int32 upper = 2 [(buf.validate.field).int32.gte = 1];
}
message BackfillRecord {
  string backfill_id = 1 [(buf.validate.field).string.uuid = true];
  string source_query_id = 2 [(buf.validate.field).string.uuid = true];
  string query_id = 3 [(buf.validate.field).string.uuid = true];
  Search search = 4;
  string status = 5 [(buf.validate.field).string = {in: ["pending", "running", "waiting", "succeeded", "partial", "failed"]}];
  int32 generation = 6 [(buf.validate.field).int32.gte = 0];
  repeated BackfillRange ranges = 7 [(buf.validate.field).repeated.max_items = 100];
  repeated string active_pmids = 8 [(buf.validate.field).repeated = {max_items: 200, unique: true, items: {string: {pattern: "^[0-9]+$"}}}];
  string current_request_id = 9;
  string run_id = 10;
  string created_at = 11;
  string updated_at = 12;
  string finished_at = 13;
  string error = 14;
  int32 total = 15;
  bool initialized = 16;
  int32 discovered = 17;
  int32 completed = 18;
  int32 published = 19;
  int32 unavailable = 20;
  int32 failed = 21;
}

// Public progress omits the worker's private discovery frontier and ownership.
message BackfillProgress {
  string backfill_id = 1 [(buf.validate.field).string.uuid = true];
  string source_query_id = 2 [(buf.validate.field).string.uuid = true];
  string query_id = 3 [(buf.validate.field).string.uuid = true];
  Search search = 4;
  string status = 5 [(buf.validate.field).string = {in: ["pending", "running", "waiting", "succeeded", "partial", "failed"]}];
  int32 generation = 6 [(buf.validate.field).int32.gte = 0];
  string current_request_id = 7;
  string created_at = 8;
  string updated_at = 9;
  string finished_at = 10;
  string error = 11;
  int32 total = 12 [(buf.validate.field).int32.gte = 0];
  bool initialized = 13;
  int32 discovered = 14 [(buf.validate.field).int32.gte = 0];
  int32 completed = 15 [(buf.validate.field).int32.gte = 0];
  int32 published = 16 [(buf.validate.field).int32.gte = 0];
  int32 unavailable = 17 [(buf.validate.field).int32.gte = 0];
  int32 failed = 18 [(buf.validate.field).int32.gte = 0];
  int32 remaining = 19 [(buf.validate.field).int32.gte = 0];
  bool discovery_complete = 20;
}
